name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Matches the floor in pubspec.yaml, so CI fails on anything that
          # needs a newer framework than the package claims to support.
          flutter-version: 3.47.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyse
        run: flutter analyze

      # Goldens are excluded: their baselines are macOS-rendered, and a Linux
      # runner paints text differently. They stay a local pre-release check.
      - name: Test
        run: flutter test --exclude-tags golden

      - name: Build the example
        run: flutter build apk --debug
        working-directory: example

  publishable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Publish dry run
        run: dart pub publish --dry-run

      - name: Score with pana
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 0 .
