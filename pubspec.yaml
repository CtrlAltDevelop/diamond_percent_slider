name: diamond_percent_slider
description: >-
  An integer slider on a scale of diamonds, with a thumb that leans the way it
  is dragged and a bubble showing the value while it moves.
version: 1.0.1
homepage: https://github.com/CtrlAltDevelop
repository: https://github.com/CtrlAltDevelop/diamond_percent_slider
issue_tracker: https://github.com/CtrlAltDevelop/diamond_percent_slider/issues

topics:
  - slider
  - percent
  - widget
  - trading

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

screenshots:
  - description: >-
      The slider unlabelled, with a percent scale, and as a leverage picker.
    path: screenshots/slider.png
  - description: >-
      The thumb leaning into a drag, with the value bubble above it.
    path: screenshots/tilt-on-swipe.gif
  - description: >-
      Coarse steps, a custom tint, and the slider disabled.
    path: screenshots/variants.png
  - description: >-
      The default colours in a dark theme.
    path: screenshots/dark.png
